# Prometheus scrape configuration for an wirenet fleet. The targets live in
# file_sd files under /etc/prometheus/wirenet, which `wirenet-lab deploy` writes
# from the Terraform outputs (or `wirenet-lab monitoring --out DIR` writes for
# a Prometheus elsewhere). Each target carries node and role labels.
# Prometheus itself listens on 127.0.0.1:9099, since wirenet-cp holds :9090.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: wirenet-cp
    file_sd_configs:
      - files: [/etc/prometheus/wirenet/wirenet-cp.json]

  - job_name: wirenet-agent
    file_sd_configs:
      - files: [/etc/prometheus/wirenet/wirenet-agent.json]

  - job_name: wirenet-relay
    file_sd_configs:
      - files: [/etc/prometheus/wirenet/wirenet-relay.json]

  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/wirenet/node.json]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9099]
